[project]
name = "better-tiss-calendar"
version = "0.0.1"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "icalendar>=7.3.0",
    "requests>=2.34.2",
]
requires-python = "==3.15.*"
authors = [{ name = "flofriday" }]
description = "A better TISS calendar"
readme = "README.md"
license = { file = "LICENSE.txt" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
exclude = ["venv", ".venv", "**/resources"]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = ["venv", ".venv", "**/resources"]

[dependency-groups]
dev = [
    "pytest-mock>=3.16.0",
    "pytest>=9.1.1",
    "syrupy>=6.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]
